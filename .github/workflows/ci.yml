name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "**/Dockerfile"
      - "docker-compose*.yml"
      - "Caddyfile"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "**/Dockerfile"
      - "docker-compose*.yml"
      - "Caddyfile"

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mr_wallet
          POSTGRES_PASSWORD: mr_wallet
          POSTGRES_DB: mr_wallet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mr_wallet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mr_wallet:mr_wallet@localhost:5432/mr_wallet?schema=public
      JWT_SECRET: ci-test-secret
      IP_HASH_SALT: ci-test-salt

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Prisma migrate deploy
        run: npm run prisma:migrate:deploy -w apps/api

      - name: Prisma seed
        run: npm run prisma:seed -w apps/api

      - name: Test
        run: npm run test

      - name: i18n key parity (fr/en)
        run: npm run i18n:check -w apps/web
