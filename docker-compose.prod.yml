# Production-shaped stack: api + caddy (+ optional postgres, + optional web), all built from source.
# Requires a `.env` file at repo root (see .env.prod.example) with real secrets -
# never reuse the dev defaults from docker-compose.yml in this file.
#
# Typical deploy (DB on Neon, front end hosted separately on Vercel):
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build api caddy
#
# Self-hosting Postgres instead of Neon (set DATABASE_URL to point at the
# `postgres` service, e.g. postgresql://user:pass@postgres:5432/db):
#   docker compose -f docker-compose.prod.yml --env-file .env --profile local-db up -d --build
#
# Self-hosting the front end too: add the `web` service to either command above.

services:
  # Only needed if you're NOT using Neon (or another managed Postgres). Not started
  # by default - add `--profile local-db` to the `docker compose` command to include it,
  # and point DATABASE_URL at postgres:5432 in .env when you do.
  postgres:
    image: postgres:16
    restart: unless-stopped
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      IP_HASH_SALT: ${IP_HASH_SALT}
      CORS_ORIGIN: ${CORS_ORIGIN}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      PORT: 3000
    # No published port - only reachable through the caddy reverse proxy below.
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Optional: only needed if self-hosting the front end instead of deploying
  # apps/web to Vercel. Not started by the plain `up -d` command below (it's
  # still built if you `docker compose up web`, but everyday deploys only
  # need `docker compose up -d --build postgres api caddy`).
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3001:3000"

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
