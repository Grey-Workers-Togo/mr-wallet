services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: budget_manager
      POSTGRES_PASSWORD: budget_manager
      POSTGRES_DB: budget_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
